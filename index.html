<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime City Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <h2 class="logo">Logo</h2>
        <nav class="navigation">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
            <button class="btnLogin-popup">Login</button>
        </nav>
    </header>

    <div class="wrapper" id="loginWrapper">
        <span class="icon-close"><i class="fas fa-times"></i></span>
        
        <div class="form-box login">
            <h2>Login</h2>
            <form id="animeLoginForm">
                <div class="input-box">
                    <span class="icon"><i class="fas fa-envelope"></i></span>
                    <input type="text" id="animeUser" required>
                    <label>Username / Email</label>
                </div>
                <div class="input-box">
                    <span class="icon"><i class="fas fa-lock"></i></span>
                    <input type="password" id="animePass" required>
                    <label>Password</label>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <div class="login-register">
                    <p>Don't have an account? <a href="#" class="register-link">Register</a></p>
                </div>
            </form>
        </div>

        <!-- Hidden Profile Card after Login -->
        <div class="profile-card" id="animeProfile" style="display: none;">
            <div class="profile-content">
                <img src="https://sami21-lgtm.github.io/Md.-Emtiaz-Hossain-Sami/assets/images/profile.jpg" alt="Sami">
                <h3>Md. Emtiaz Hossain Sami</h3>
                <p>Software Engineering Student | DIU</p>
                <a href="https://sami21-lgtm.github.io/Md.-Emtiaz-Hossain-Sami/" target="_blank" class="portfolio-btn">Portfolio</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
