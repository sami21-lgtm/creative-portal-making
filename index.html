<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sami's Anime Portal | Glassmorphism</title>
    <!-- FontAwesome icons er jonno -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2 class="logo">Logo</h2>
        <nav class="navigation">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
            <button class="btnLogin-popup">Login</button>
        </nav>
    </header>

    <div class="wrapper">
        <span class="icon-close"><i class="fas fa-times"></i></span>
        
        <!-- Login Form Section -->
        <div class="form-box" id="loginArea">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="input-box">
                    <span class="icon"><i class="fas fa-envelope"></i></span>
                    <input type="text" id="userInput" required>
                    <label>Username</label>
                </div>
                <div class="input-box">
                    <span class="icon"><i class="fas fa-lock"></i></span>
                    <input type="password" id="passInput" required>
                    <label>Password</label>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <div class="login-register">
                    <p>Don't have an account? <a href="#">Register</a></p>
                </div>
            </form>
        </div>

        <!-- Profile Section (Login successful hole eti show hobe) -->
        <div class="profile-card" id="profileArea">
            <img src="https://sami21-lgtm.github.io/Md.-Emtiaz-Hossain-Sami/assets/images/profile.jpg" alt="Sami">
            <h3>Md. Emtiaz Hossain Sami</h3>
            <p>Software Engineering Student | DIU</p>
            <a href="https://sami21-lgtm.github.io/Md.-Emtiaz-Hossain-Sami/" target="_blank" class="portfolio-btn">View My Portfolio</a>
            <p style="margin-top: 15px;"><a href="javascript:location.reload()" style="color: #fff; text-decoration: underline;">Logout</a></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
